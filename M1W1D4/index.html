<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header">
        <div class="logo"><img src="./assets/logo.png" alt="logo amazon">
        </div>
        <div class="Nav">
            <a href="#">All</a>
            <a href="#">Today's deals</a>
            <a href="#">Customer Service</a>
            <a href="#">Registry</a>
            <a href="#">Gift Cards</a>
            <a href="#">Sell</a>
        </div>
    </div>

    <div class="topContainer">
        <div class="CTA">
            <p>Shop All Holiday Gift Cards</p>
        </div>
        <div class="giftGuides">
            <p class="title">Holiday Gift Guides</p>
            <p class="subtitle">Be a go-gifter</p>
        </div>
    </div>

    <div class="rowShopping">
        <div class="boxCard">
            <p>Find the perfect gift
                <span>Shop now</span>
            </p>
            <div class="grid1">
                <div class="card"><img src="./assets/img_1.jpg" alt="kindle"></div>
                <div class="card"><img src="./assets/img_2.jpg" alt="misc"></div>
                <div class="card"><img src="./assets/img_3.jpg" alt="watches"></div>
                <div class="card"><img src="./assets/img_4.jpg" alt="pets"></div>
            </div>
        </div>
        <div class="banner">
            <figure class="gaming"><img src="./assets/img_9.png" alt="VR device"></figure>
            <figcaption class="figcaption">Play the gifting game <span>Shop gaming</span></figcaption>
        </div>
        <div class="banner">
            <figure class="audio"><img src="./assets/img_10.png" alt="VR device"></figure>
            <figcaption class="figcaption">The Sound of cheer <span>Shop Audio & Accessories</span></figcaption>
        </div>
    </div>
    <div class="footer">
        <div class="back"><a href="#header">Back to top</a></div>
        <div class="logoFooter"><img src="./assets/logo.png" alt="logo amazon"></div>

    </div>

</body>

</html>
