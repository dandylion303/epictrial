<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header">
        <div class="logo"><img src="./assets/logo.png" alt="logo amazon">
        </div>
        <div class="Nav">
            <a href="#">All</a>
            <a href="#">Today's deals</a>
            <a href="#">Customer Service</a>
            <a href="#">Registry</a>
            <a href="#">Gift Cards</a>
            <a href="#">Sell</a>
        </div>
    </div>

    <div class="topContainer">
        <div class="CTA">
            <p>Shop All Holiday Gift Cards</p>
        </div>
        <div class="giftGuides">
            <p class="title">Holiday Gift Guides</p>
            <p class="subtitle">Be a go-gifter</p>
        </div>
    </div>

    <div class="rowShopping">
        <div class="boxCard">
            <p>Find the perfect gift
                <span>Shop now</span>
            </p>
            <div class="grid1">
                <div class="card"><img src="./assets/img_1.jpg" alt="kindle"></div>
                <div class="card"><img src="./assets/img_2.jpg" alt="misc"></div>
                <div class="card"><img src="./assets/img_3.jpg" alt="watches"></div>
                <div class="card"><img src="./assets/img_4.jpg" alt="pets"></div>
            </div>
        </div>
        <div class="banner">
            <figure class="gaming"><img src="./assets/img_9.png" alt="VR device"></figure>
            <figcaption class="figcaption">Play the gifting game <span>Shop gaming</span></figcaption>
        </div>
        <div class="banner">
            <figure class="audio"><img src="./assets/img_10.png" alt="VR device"></figure>
            <figcaption class="figcaption">The Sound of cheer <span>Shop Audio & Accessories</span></figcaption>
        </div>

        <div class="extra">
            <div class="extraCard">
                <p>Gaming accessories</p>
                <img src="./assets/extra/gaming/img_15.jpg" alt="cuffie">
                <img src="./assets/extra/gaming/img_16.jpg" alt="keyboard">
                <img src="./assets/extra/gaming/img_17.jpg" alt="mouse">
                <img src="./assets/extra/gaming/img_18.jpg" alt="sedia">
                <a href="#">See More</a>
            </div>
            <div class="extraCard">
                <p>Comfy styles</p>
                <img src="./assets/extra/style/img_19.jpg" alt="sweatshirts">
                <img src="./assets/extra/style/img_20.jpg" alt="Joggers">
                <img src="./assets/extra/style/img_21.jpg" alt="Cardigan">
                <img src="./assets/extra/style/img_22.jpg" alt="maglietta">
                <a href="#">See more</a>
            </div>
            <div class="extraCard">
            <p>Holiday Gifts</p>
            <img src="./assets/extra/Gifts/img_11.jpg" alt="Elettronica">
            <img src="./assets/extra/Gifts/img_12.jpg" alt="Moda">
            <img src="./assets/extra/Gifts/img_13.jpg" alt="Toys">
            <img src="./assets/extra/Gifts/img_14.jpg" alt="Beauty">
            <a href="#">See more</a>
        </div>
            <div class="extraCard">
                <p>Add joy to their wish list</p>
                <img src="./assets/extra/Joy/img_24.jpg" alt="giochi">
                <img src="./assets/extra/Joy/img_25.jpg" alt="Regali elettronici">
                <img src="./assets/extra/Joy/img_26.jpg" alt="Casa">
                <img src="./assets/extra/Joy/img_27.jpg" alt="Fashion">
                <a href="#">See more</a>
            </div>
        </div>

    </div>

    <div class="footer">
        <div class="back"><a href="#header">Back to top</a></div>
        <div class="logoFooter"><img src="./assets/logo.png" alt="logo amazon"></div>

    </div>

</body>

</html>
